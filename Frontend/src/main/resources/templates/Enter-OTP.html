<!DOCTYPE html>
<html lang="vi" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Nhập OTP</title>
    <link rel="stylesheet" href="/css/auth.css">
    <!--  FontAwesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script defer src="/js/auth.js"></script>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <img src="/images/logo2.png" alt="Logo" class="logo">
        <h2>Xác minh OTP</h2>
            <p class="auth-switch">Kiểm tra mã OTP trong Email của bạn.</p>
        <form id="otpForm" onsubmit="event.preventDefault(); verifyOtp();">
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="otpInput" placeholder="Nhập mã OTP" required>
            </div>

            <button type="submit" class="btn btn-primary">Xác minh</button>
            <p class="or-text">-or-</p>
            <p class="auth-switch">Quay lại trang<a href="/Register"> Đăng ký</a></p>
        </form>
    </div>
</div>
<script>
    // ==== Hàm xác thực OTP (cho trang Enter-Otp) ====
    function verifyOtp() {
        const enteredOtp = document.getElementById('otpInput').value;
        const userData = JSON.parse(localStorage.getItem('pendingUser'));

        if (enteredOtp === String(userData.otp)) {
            fetch('http://localhost:8080/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName: userData.fullName,
                    email: userData.email,
                    password: userData.password,
                    role: userData.role,
                    createdAt: new Date().toISOString(),
                    usersStatus: 'active'
                })
            })
                .then(res => {
                    if (!res.ok) throw new Error('Đăng ký thất bại');
                    return res.json();
                })
                .then(() => {
                    alert('Xác minh thành công! Tài khoản đã được tạo.');
                    localStorage.removeItem('pendingUser');
                    window.location.href = '/Login';
                })
                .catch(err => {
                    alert('Lỗi khi đăng ký người dùng: ' + err.message);
                });
        } else {
            alert('Mã OTP không chính xác!');
        }
    }
</script>



</body>
</html>
